<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Video Downloader</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f172a; color: #f1f5f9; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 20px; font-size: 14px; }
  .box { display: flex; gap: 8px; }
  input { flex: 1; padding: 13px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; min-width: 0; }
  button { padding: 13px 18px; border: 0; border-radius: 10px; background: #f97316; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin: 14px 0; color: #fbbf24; font-size: 14px; min-height: 20px; }
  .card { background: #1e293b; border-radius: 14px; padding: 14px; display: none; }
  .card img { width: 100%; border-radius: 10px; }
  .card h2 { font-size: 17px; margin: 12px 0 4px; }
  .card .meta { color: #94a3b8; font-size: 13px; margin-bottom: 14px; }
  .fmt { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid #334155; }
  .fmt .label { flex: 1; font-weight: 600; }
  .fmt .size { color: #94a3b8; font-size: 13px; }
  .fmt a { background: #22c55e; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .foot { color: #64748b; font-size: 12px; margin-top: 24px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⬇ All Video Downloader</h1>
  <p class="sub">Paste a video link from YouTube, Facebook, TikTok, Instagram and more — pick a format and download in one click.</p>
  <div class="box">
    <input id="url" type="url" placeholder="Paste video link here…" autocomplete="off">
    <button id="go" onclick="fetchFormats()">Get formats</button>
  </div>
  <div id="status"></div>
  <div class="card" id="card">
    <img id="thumb" alt="">
    <h2 id="title"></h2>
    <div class="meta" id="meta"></div>
    <div id="formats"></div>
  </div>
  <p class="foot">Free and open source. Works with public videos. Private, login-only or age-restricted videos may not download. Download only videos you have the right to save.</p>
</div>
<script>
function fmtSize(n) {
  if (!n) return "";
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  return Math.round(n / 1024) + " KB";
}
function fmtDur(s) {
  if (!s && s !== 0) return "";
  s = Math.round(s);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
async function fetchFormats() {
  const url = document.getElementById("url").value.trim();
  const status = document.getElementById("status");
  const card = document.getElementById("card");
  const btn = document.getElementById("go");
  if (!url) { status.textContent = "Please paste a video link first."; return; }
  btn.disabled = true; status.textContent = "Reading video… please wait.";
  card.style.display = "none";
  try {
    const r = await fetch("/api/formats", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not read this video.");
    document.getElementById("thumb").src = d.thumbnail || "";
    document.getElementById("title").textContent = d.title;
    document.getElementById("meta").textContent =
      [d.uploader, fmtDur(d.duration)].filter(Boolean).join(" • ");
    document.getElementById("formats").innerHTML = d.formats.map(f => {
      const dl = "/api/download?url=" + encodeURIComponent(url) +
                 "&format_id=" + encodeURIComponent(f.id);
      return '<div class="fmt"><span class="label">' + f.label +
        " <small>(" + f.ext.toUpperCase() + ")</small></span>" +
        '<span class="size">' + fmtSize(f.filesize) + "</span>" +
        '<a href="' + dl + '">Download</a></div>';
    }).join("");
    status.textContent = ""; card.style.display = "block";
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
  btn.disabled = false;
}
</script>
</body>
</html>
